name: Publish Liuji with existing Docker credential
on:
  workflow_dispatch:
  push:
    branches: [codex/liuji-publish]
    paths: [.github/workflows/liuji.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: YorenZZZ/liuji
          ref: 55bf33bfb733fc9105f84f048d35c5630c1c914b
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci && npm run check && npm run check:privacy && npm test && npm run build
      - id: version
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: yorenzzz
          password: ${{ secrets.YORENZZZ }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yorenzzz/liuji:latest
            yorenzzz/liuji:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=留迹
            org.opencontainers.image.description=Docker自部署时间轴笔记工具，可快速导出为截图。
            org.opencontainers.image.source=https://github.com/YorenZZZ/liuji
            org.opencontainers.image.revision=55bf33bfb733fc9105f84f048d35c5630c1c914b
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify public Docker Hub description
        run: |
          python3 - <<'PYTHON'
          import json, urllib.request
          with urllib.request.urlopen('https://hub.docker.com/v2/repositories/yorenzzz/liuji/', timeout=30) as r:
              repository = json.load(r)
          assert repository['description'] == 'Docker自部署时间轴笔记工具，可快速导出为截图。'
          assert 'docs/images/timeline.jpg' in repository['full_description']
          print('Public description and screenshot verified. README updates use Docker Hub account settings.')
          PYTHON
