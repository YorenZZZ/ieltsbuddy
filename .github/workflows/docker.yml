name: Publish Reels with existing Docker credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: YorenZZZ/reels
          ref: 8bda1a2b6bb69e45fba1f7fbc5cf4c7879f2bcee
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - run: npm run check:privacy
      - run: npm test
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: YorenZZZ/reels
          ref: 8bda1a2b6bb69e45fba1f7fbc5cf4c7879f2bcee
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: yorenzzz
          password: ${{ secrets.YORENZZZ }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yorenzzz/reels:latest
            yorenzzz/reels:1.1.2
          labels: |
            org.opencontainers.image.title=Reels
            org.opencontainers.image.description=自托管短视频播放器，让NAS收藏的短视频像抖音一样优雅观看。
            org.opencontainers.image.source=https://github.com/YorenZZZ/reels
            org.opencontainers.image.revision=8bda1a2b6bb69e45fba1f7fbc5cf4c7879f2bcee
            org.opencontainers.image.version=1.1.2
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
